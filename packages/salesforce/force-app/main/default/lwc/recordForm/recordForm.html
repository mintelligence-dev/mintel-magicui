<template>
    <article class="form">
        <header lwc:if={title} class="head">
            <h2 class="title">{title}</h2>
        </header>
        <lightning-record-edit-form
            record-id={recordId}
            object-api-name={objectApiName}
            onsubmit={handleSubmit}
            onsuccess={handleSuccess}
            onerror={handleError}
        >
            <lightning-messages></lightning-messages>
            <template lwc:if={hasSections}>
                <template for:each={parsedSections} for:item="section">
                    <section key={section.key} class="section">
                        <h3 lwc:if={section.title} class="section-title">{section.title}</h3>
                        <div class={gridClass}>
                            <template for:each={section.fields} for:item="field">
                                <lightning-input-field key={field.key} field-name={field.name}></lightning-input-field>
                            </template>
                        </div>
                    </section>
                </template>
            </template>
            <footer class="actions">
                <template lwc:if={showCancel}>
                    <lightning-button label={t.cancel} onclick={handleCancel}></lightning-button>
                </template>
                <lightning-button variant="brand" type="submit" label={buttonLabel} disabled={saving}></lightning-button>
            </footer>
        </lightning-record-edit-form>
    </article>
</template>
