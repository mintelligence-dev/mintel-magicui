<template>
    <article class="kpi">
        <div class="top">
            <p class="label">{label}</p>
            <template lwc:if={deltaText}><span class={deltaClass}>{deltaText}</span></template>
        </div>
        <p class="value"><span class="number">{displayValue}</span><template lwc:if={suffix}><span class="suffix">{suffix}</span></template></p>
        <template lwc:if={hasTrend}>
            <svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" role="img" aria-label={trendLabel}>
                <path class="area" d={areaPath}></path>
                <path class="line" d={linePath} pathLength="1"></path>
                <circle class="dot" cx={lastX} cy={lastY} r="2.2"></circle>
            </svg>
        </template>
        <template lwc:if={caption}><p class="caption">{caption}</p></template>
    </article>
</template>
