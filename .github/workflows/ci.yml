name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Generated files are committed
        run: |
          git diff --exit-code -- packages/tokens/dist packages/tokens/lwc packages/tokens/salesforce \
            packages/salesforce/force-app/main/default/lwc/tokens packages/salesforce/force-app/main/default/staticresources \
            apps/docs/registry.json apps/docs/public/r apps/docs/app/registry.css \
            || (echo "::error::Run 'npm run build' and commit the generated files." && exit 1)

  # Accessibility (axe) on every docs page, in the Playwright image (browsers preinstalled).
  # Visual regression is not run here: it took most of the job's time. Run it locally before merging
  # UI changes: npm run test:e2e:docker -w docs -- e2e/visual.spec.ts
  qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Accessibility (axe)
        run: npx playwright test e2e/a11y.spec.ts
        working-directory: apps/docs
      - name: Upload report (axe findings)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          retention-days: 14
