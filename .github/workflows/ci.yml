name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generated files are committed
        run: |
          git diff --exit-code -- packages/tokens/dist packages/tokens/lwc packages/tokens/salesforce \
            apps/docs/registry.json apps/docs/public/r apps/docs/app/registry.css \
            || (echo "::error::Run 'npm run build' and commit the generated files." && exit 1)
